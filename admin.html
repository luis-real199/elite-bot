<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Blacklist — Demos</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <section class="login" id="login" hidden>
    <form id="login-form">
      <img src="assets/logo-sm.jpg" alt="Blacklist Records">
      <input name="email" type="email" placeholder="Email" required autocomplete="username">
      <input name="password" type="password" placeholder="Κωδικός" required autocomplete="current-password">
      <button class="btn" type="submit">Είσοδος</button>
      <p class="msg bad" id="login-msg"></p>
    </form>
  </section>

  <section id="app" hidden>
    <header class="bar">
      <img src="assets/icon.png" alt="">
      <h1>BLACKLIST · DEMOS</h1>
      <button class="icon-btn" id="refresh" type="button" aria-label="Ανανέωση">↻</button>
      <button class="icon-btn" id="logout" type="button">Έξοδος</button>
    </header>
    <div class="tools">
      <div class="tabs" id="tabs"></div>
      <input id="search" type="search" placeholder="Αναζήτηση: καλλιτέχνης, τίτλος, είδος…">
    </div>
    <p class="keys">Space play/pause · N/P επόμενο/προηγούμενο · ←/→ ±10s · S shortlist · X απόρριψη · 1–5 αστέρια</p>
    <div id="list"></div>
  </section>

  <div class="player" id="player" hidden>
    <div class="now"><strong id="now-title"></strong><span id="now-artist"></span></div>
    <div class="controls">
      <button id="prev" type="button" aria-label="Προηγούμενο"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="toggle" class="main" type="button" aria-label="Play"></button>
      <button id="next" type="button" aria-label="Επόμενο"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="t-dur">0:00</span></div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
