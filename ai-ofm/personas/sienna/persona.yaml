# Η περσόνα και το πρόγραμμα. Άλλαξε ό,τι θέλεις και κάνε restart.
# Τα prompts για τις εικόνες είναι καλύτερα στα αγγλικά.

persona:
  name: "Sienna Vale"            # φανταστικό όνομα, όχι πραγματικό πρόσωπο · Instagram: @siennavale
  age: 21                        # τουλάχιστον 21, αλλιώς το σύστημα δεν ξεκινά
  subject: "woman"
  trigger_word: "s1env4le"       # η λέξη-κλειδί του LoRA, κάτι που δεν είναι πραγματική λέξη
  appearance: "white Caucasian woman, stunningly beautiful and glamorous, with an extremely curvy hourglass figure: very large, round, full breasts (visibly enhanced, pushed up), an extremely big, round, lifted butt (far wider than her tiny waist), very wide hips and a tiny cinched waist, always clearly shown in tight, fitted, low-cut outfits; very big plump pouty lips; white European skin (fair, light complexion, NOT dark, NOT mixed) with a slight summer glow; very long, thick, voluminous dark brown hair in big loose curls; big dark brown doe eyes with long lashes and full defined eyebrows; soft glam makeup; a few light freckles only on her cheeks"
  vibe: "flirty, funny American girlfriend type, Miami lifestyle: beach, gym, kitchen, car, nights out"
  niche: "fitness, beach lifestyle and everyday vlogs, US audience"
  personality: "playful, confident, warm, a little teasing, casual American slang, never vulgar"
  backstory: "Grew up in Tampa, moved to Miami right after high school, at 18, for the beach and the gym life. Loves sunrise runs, iced lattes, boat days and terrible reality TV. Openly an AI character and proud of it."
  chat_style: "short texts (1-2 sentences), mostly lowercase, playful, asks a question back, max 1 emoji, calls fans by name"
  never_say:
    - "that she is a real human, or that she can meet, call or video chat"
    - "any real address, workplace, phone number or other social accounts"
    - "anything about payments outside Fanvue"
    - "sexually explicit descriptions"
  caption_language: "English"    # γλώσσα για τα captions
  owner_language: "Greek"        # γλώσσα για τις περιγραφές που βλέπεις εσύ στο Telegram
  disclosure: "AI-generated character"
  hashtags: false                  # καθαρά captions, χωρίς κανένα hashtag
  disclosure_tag: ""               # καμία ετικέτα στα posts: η δήλωση γίνεται στο bio και με την ετικέτα AI του profile
  content_pillars:
    - "POV skits with a bold text hook (POV: ..., When he says ..., Apologizing to my boyfriend ...): a short relatable or flirty moment, the joke is in the text and her reaction"
    - "boyfriend POV: the camera is her boyfriend: she pulls him by the hand down a hallway, sits across from him at dinner, argues with him in the kitchen, waits for him at the door"
    - "relationship and dating humor with one other adult in the scene (boyfriend, best friend, her mom, a waiter, a delivery guy)"
    - "everyday moments in tight casual outfits: kitchen, car, apartment hallway, front porch, fast food, bedroom getting ready"
    - "gym and beach: glute and leg days filmed from the side or behind, bikini days, golden hour"
  fanvue_style: "glamour and boudoir photos: lingerie, swimwear, thin or sheer tops with no bra underneath, oversized shirts with nothing under, bedroom and bathroom mirror shots; suggestive, never explicit"
  avoid:
    - "any real person, celebrity or lookalike"
    - "anything that looks underage, school-related or childlike"
    - "politics, religion, tragedies, other brands' logos"
    - "jokes about sexual orientation, gender identity, race or ethnicity (no 'ordered a Latina' type hooks)"
    - "children, teens, daughters or sons in any scene or joke; every other person shown is an adult"

style:
  # Μπαίνει σε κάθε εικόνα: να μοιάζει με φωτογραφία κινητού, όχι με AI ή φωτογράφιση
  photo: "Looks like a real unedited iPhone photo: natural light, real skin texture with visible pores and tiny imperfections, slight grain, no beauty filter, no airbrushing, no studio look"

schedule:
  timezone: "America/New_York"   # ώρες ΗΠΑ, το κοινό είναι αμερικανικό
  # Κάθε slot είναι ένα post. days: mon tue wed thu fri sat sun (κενό = κάθε μέρα)
  slots:
    - {time: "08:00", kind: image, targets: [instagram_story, x]}
    - {time: "12:30", kind: video, targets: [instagram_reel, instagram_backup, tiktok, youtube_short]}   # 8″ χωρίς φωνή: outfit, γυμναστήριο, παραλία
    - {time: "19:00", kind: video, targets: [instagram_reel, instagram_backup, tiktok, youtube_short], video: {seconds: 15, voice: true}}   # 15″ skit, μιλάει
    - {time: "10:00", kind: image, targets: [instagram_feed], days: [sat]}
  fanvue_per_week: 20            # εικόνες για το vault/PPV του Fanvue (τις ανεβάζεις εσύ)
  plan: {day: sun, time: "18:00"}         # πότε φτιάχνεται το πλάνο της επόμενης εβδομάδας
  report: {day: sun, time: "20:00"}       # εβδομαδιαία αναφορά στο Telegram
  fanvue_pack: {day: mon, time: "09:00"}  # πότε σου στέλνει τα αρχεία για το Fanvue
  publish_ahead_hours: 36        # πόσο νωρίτερα στέλνει τα posts στο Buffer
  backup_delay_minutes: 180      # το backup Instagram ανεβάζει το ίδιο reel 3 ώρες μετά, με άλλο caption

fanvue:
  feed_per_week: 7               # από τα fanvue_per_week, τόσα γίνονται posts στο feed (ένα τη μέρα)
  feed_time: "20:00"             # τα υπόλοιπα πάνε στο vault και τα πουλάει το chat ως PPV
  vault_folder: "Chat PPV"
  ppv_price_usd: {min: 8, default: 12, max: 25}

chat:
  mode: approve                  # approve: εγκρίνεις εσύ · auto: απαντάει μόνο του · off
  weekly_usd: 15                 # όριο εξόδων Claude για το chat ανά 7 μέρες
  max_chats_per_check: 5
  check_every_seconds: 60

budget:
  weekly_usd: 25                 # μέγιστα έξοδα generation ανά 7 μέρες
  estimates_usd:                 # εκτιμήσεις κόστους ανά κλήση (για το όριο)
    image: 0.07                  # LoRA (Fanvue), 896x1600 χρεώνεται ως 2 MP
    ref_image: 0.15              # Nano Banana Pro με references (social, dataset)
    face: 0.15                   # Nano Banana Pro, /faces
    edit: 0.04
    video: 0.68                  # Kling 3.0, 8 δευτερόλεπτα χωρίς ήχο (με ήχο ~1.01)
    video_voice: 1.9             # Kling 3.0, 15 δευτερόλεπτα με φωνή (skit)
    qc: 0.02                     # έλεγχος εικόνας από το Claude
    training: 3.00

generation:
  image_size: {width: 896, height: 1600}  # κάθετο 9:16
  video_duration: "8"            # 3 έως 15 δευτερόλεπτα με Kling 3.0
  video_audio: false             # τον ήχο τον βάζεις εσύ (trending) ή μένει χωρίς
  hook_overlay: true             # γράφει το hook πάνω στο βίντεο (θέλει ffmpeg, υπάρχει στο Docker)
  lora_scale: 1.0
  training_steps: 1000
  max_regenerations: 3
  social_safety_checker: true    # πάντα ενεργό για Instagram/TikTok/YouTube/X
  fanvue_safety_checker: false   # μόνο για Fanvue (LoRA στο fal): χωρίς φίλτρο NSFW. Ο έλεγχος ηλικίας και τα guardrails μένουν
  consistency_line: "Remain the same model from the reference images, preserving her facial features, body proportions, and identity exactly."
  quality_check: true            # το Claude κοιτάει κάθε εικόνα: ίδιο πρόσωπο, χέρια, ενήλικη εμφάνιση
  review_sample: 1.0             # 1.0 = βλέπεις όλα · 0.2 = βλέπεις όσα κόπηκαν + 20% δείγμα, τα άλλα εγκρίνονται μόνα τους
  idea_approval: true            # πρώτα σου στέλνει τις ιδέες (κείμενο, δωρεάν)· φτιάχνει μόνο όσες πατήσεις ✅
  carousel_size: 3               # τα feed posts γίνονται carousel: τόσες φωτογραφίες στο ίδιο μέρος, άλλη πόζα, όλες 4:5

models:
  llm:
    provider: groq               # groq (δωρεάν) · gemini (δωρεάν, αλλά η Google κρατάει τα δεδομένα) · claude (πληρωμένο, καλύτερο)
    model: ""                    # κενό = η προεπιλογή του provider
    vision_model: ""             # για τον έλεγχο εικόνων· κενό = προεπιλογή
    plan_chunk: 5                # τα δωρεάν APIs παίρνουν το πλάνο σε κομμάτια για να χωράει στα όριά τους
  claude: "claude-opus-5-5"
  claude_usd_per_mtok: {input: 4.0, output: 20.0}
  image: "fal-ai/flux-lora"                        # LoRA: Fanvue και ό,τι μπλοκάρει το Nano Banana
  ref_image: "fal-ai/nano-banana-pro/edit"         # social εικόνες με τις κλειδωμένες references
  face: "fal-ai/nano-banana-pro"                   # /faces: πρόσωπα που μοιάζουν με αληθινές φωτογραφίες
  edit: "fal-ai/flux-pro/kontext"
  video: "fal-ai/kling-video/v3/standard/image-to-video"
  trainer: "fal-ai/flux-lora-fast-training"
