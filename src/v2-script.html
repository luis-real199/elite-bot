/* ---- layers: one place that opens/closes overlays, locks scroll and moves focus ---- */
const layers = [];
const topLayer = () => layers[layers.length - 1];
const visible = el => !!el && el.offsetParent !== null;
/* Everything outside the top layer is inert while a layer is open, so keyboard and screen-reader
   users cannot wander behind it. The chat stays usable on the product page only. */
function applyInert(){
  const top = topLayer();
  [...document.body.children].forEach(el => {
    if (el.id === 'live') return;
    let on = !!top && el !== top;
    if (el.id === 'scrim') on = false;
    if ((el.id === 'chat' || el.id === 'chatBtn') && (!top || top === $('#pdp'))) on = false;
    if (el.id === 'stickybuy' && top === $('#pdp')) on = false;
    el.inert = on;
  });
}
function setLayer(el, on, focusSel){
  const i = layers.indexOf(el);
  if (on && i < 0){ el._prevFocus = document.activeElement; layers.push(el); el.classList.add('on'); }
  if (!on && i >= 0){ layers.splice(i, 1); el.classList.remove('on'); }
  document.body.style.overflow = layers.length ? 'hidden' : '';
  applyInert();
  if (on){
    requestAnimationFrame(() => { const f = focusSel === null ? null : el.querySelector(focusSel || 'button,[href],input,select,textarea'); if (f) f.focus({preventScroll:true}); });
  } else if (i >= 0){
    const f = el._prevFocus, top = topLayer();
    if (top){
      const back = visible(f) && top.contains(f) ? f : (top === $('#pdp') && visible($('#pdpCart')) ? $('#pdpCart') : top.querySelector('button,[href],input,select,textarea'));
      if (back) back.focus({preventScroll:true});
    } else {
      const back = visible(f) ? f : (pdpId ? null : $('#cartBtn'));
      if (back) back.focus({preventScroll:true});
    }
  }
}
const chatHasFocus = () => $('#chat').classList.contains('on') && $('#chat').contains(document.activeElement);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (chatHasFocus()){ closeChat(); return; }
    if ($('#nav').classList.contains('open')){ $('#nav').classList.remove('open'); $('#burger').setAttribute('aria-expanded', 'false'); $('#burger').focus(); return; }
    if ($('#searchbox').classList.contains('open')){ $('#searchbox').classList.remove('open'); $('#searchBtn').setAttribute('aria-expanded', 'false'); $('#searchBtn').focus(); return; }
    const t = topLayer(); if (!t) return;
    e.preventDefault();
    if (t === $('#legal')) closeLegal();
    else if (t === $('#owner')) setLayer(t, false);
    else if (t === $('#co')) closeCheckout();
    else if (t === $('#drawer')) openCart(false);
    else if (t === $('#pdp')) closePDP();
    return;
  }
  if (e.key === 'Tab'){
    const scope = chatHasFocus() ? $('#chat') : topLayer(); if (!scope) return;
    let f = [...scope.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && visible(x));
    if (scope === $('#pdp')) f = f.concat([$('#chatBtn')].filter(visible));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!scope.contains(document.activeElement)){ e.preventDefault(); (e.shiftKey ? last : first).focus(); return; }
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

let cart = {};

  const saved = store.get('nestia-cart') || {};

    const p = byId(pidOf(k)); if (!p) continue;
    const vals = k.split('|').slice(1), spec = VAR[p.id] || [];
    const ok = vals.length === spec.length && spec.every(([, kind, opts], i) => (kind === 's' ? opts.map(o => o[0]) : opts).includes(vals[i]));
    if (ok && saved[k] > 0) cart[k] = Math.min(MAX_QTY, Math.floor(saved[k]));

}
function addToCart(key, qty){

}

function saveForm(){ $$('#coForm input, #coForm select, #coForm textarea').forEach(i => { formVals[i.id] = i.value; }); }
function validate(){
  saveForm();

  const rules = {
    'f-email': v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) || 'Enter a valid email address',
    'f-first': v => v.length > 0 || 'Required', 'f-last': v => v.length > 0 || 'Required',
    'f-addr': v => v.length > 3 || 'Enter street and number', 'f-city': v => v.length > 0 || 'Required',
    'f-zip': v => v.length > 2 || 'Enter the postcode',
    'f-phone': v => v.replace(/\D/g, '').length >= 8 || 'Enter a phone number the courier can call'
  };
  for (const id of Object.keys(rules)){
    const v = (formVals[id] || '').trim(), r = rules[id](v), w = $('#w-' + id);
    w.classList.toggle('bad', r !== true);
    $('#e-' + id).textContent = r === true ? '' : r;
    $('#' + id).setAttribute('aria-invalid', r !== true);
    if (r !== true){ ok = false; first = first || $('#' + id); }

  return ok;
}

async function pay(){
  if (!canOrder()) return;
  if (!validate()) return;
  const btn = $('#payBtn'); btn.disabled = true;
  const order = buildOrder();
  if (!API_BASE){
    order.sig = cartSig();
    const last = store.get('nestia-last-order');
    if (last && last.sig === order.sig && last.email === order.email) order.ref = last.ref;   // same cart, same person: keep one order number
    orderDone = order; store.set('nestia-last-order', order);
    renderDone();
    return;
  }
  btn.textContent = 'Opening secure payment...';
  try {
    const r = await fetch(API_BASE + '/api/checkout', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(order)});
    const data = await r.json();
    if (!r.ok || !data.url) throw new Error(data.error || 'The payment provider did not answer.');
    window.location.href = data.url;
  } catch (err) {
    btn.disabled = false; btn.textContent = `PAY ${eur(order.amount)}`;

}

async function copyText(t, btn){
  const was = btn ? btn.textContent : '';
  const flash = m => { announce(m); if (!btn) return; btn.textContent = m; setTimeout(() => { btn.textContent = was; }, 1400); };
  try { await navigator.clipboard.writeText(t); flash('Copied'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove(); flash(ok ? 'Copied' : 'Select and copy');
  }
}

  e.preventDefault();
  const input = $('#chatinput'), text = input.value.trim();

  chatAdd('user', text);

  const dots = document.createElement('div'); dots.className = 'typing'; dots.innerHTML = '<i></i><i></i><i></i>';
  $('#chatlog').appendChild(dots); $('#chatlog').scrollTop = $('#chatlog').scrollHeight;

  const hit = FAQ().find(([re]) => re.test(text));

      return;
    }

  setTimeout(() => finish(`I only know the common questions: delivery, returns, payment and damage. ${STORE.email ? 'For anything else, email ' + STORE.email + '.' : 'For anything else, use the Contact page in the footer.'}`, 'err'), 450);

    ${o.tiktok ? `<div class="plat"><div class="pl">TikTok / Reels script <button class="sbtn" data-copy="${T(o.tiktok.hook)}\n\n${T(o.tiktok.script)}\n\n${T(o.tiktok.caption)}\n${T(o.tiktok.hashtags)}">Copy</button></div><pre>${T(o.tiktok.hook)}\n\n${T(o.tiktok.script)}\n\n${T(o.tiktok.caption)}</pre><div class="hs">${T(o.tiktok.hashtags)}</div></div>` : ''}
    ${o.instagram ? `<div class="plat"><div class="pl">Instagram <button class="sbtn" data-copy="${T(o.instagram.caption)}\n\n${T(o.instagram.hashtags)}">Copy</button></div><pre>${T(o.instagram.caption)}</pre><div class="hs">${T(o.instagram.hashtags)}</div></div>` : ''}
    ${o.facebook ? `<div class="plat"><div class="pl">Facebook <button class="sbtn" data-copy="${T(o.facebook.post)}">Copy</button></div><pre>${T(o.facebook.post)}</pre></div>` : ''}
    ${o.pinterest ? `<div class="plat"><div class="pl">Pinterest <button class="sbtn" data-copy="${T(o.pinterest.title)}\n\n${T(o.pinterest.description)}">Copy</button></div><pre><b>${T(o.pinterest.title)}</b>\n${T(o.pinterest.description)}</pre></div>` : ''}
    ${o.x ? `<div class="plat"><div class="pl">X <button class="sbtn" data-copy="${T(o.x.post)}">Copy</button></div><pre>${T(o.x.post)}</pre></div>` : ''}
  </article>`; }).join('');
  $$('#postgrid [data-copy]').forEach(b => b.onclick = e => copyText(b.dataset.copy, e.currentTarget));
}
const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const productLink = p => STORE.siteUrl + '#' + p.id;
function feedCSV(){
  const head = ['id','title','description','link','image_link','additional_image_link','availability','price','condition','brand','identifier_exists','product_type','shipping'];
  const rows = P.map(p => [p.id, p.n, DETAIL[p.id].d, productLink(p), absImg(p, 0), [1,2,3].map(i => absImg(p, i)).join(','), 'in_stock', p.price.toFixed(2) + ' ' + STORE.currency, 'new', '', 'no', p.cat, `GR::Standard:${STORE.shipFee.toFixed(2)} ${STORE.currency}`]);
  return csv([head, ...rows]);
}
/* Post exports in the exact column layouts the free schedulers import.
   Posts are spread one per day per network from tomorrow at 10:00. */
const S = s => typeof s === 'string' ? s : Array.isArray(s) ? s.join(' ') : '';
const pad2 = n => String(n).padStart(2, '0');
function schedAt(i, sep){
  const d = new Date(); d.setDate(d.getDate() + 1 + i); d.setHours(10, 0, 0, 0);
  return `${d.getFullYear()}${sep}${pad2(d.getMonth() + 1)}${sep}${pad2(d.getDate())} 10:00`;
}
const postText = (o, net) => net === 'tiktok' ? [S(o.tiktok && o.tiktok.hook), S(o.tiktok && o.tiktok.caption), S(o.tiktok && o.tiktok.hashtags)].filter(Boolean).join('\n')
  : net === 'instagram' ? [S(o.instagram && o.instagram.caption), S(o.instagram && o.instagram.hashtags)].filter(Boolean).join('\n\n')
  : net === 'facebook' ? S(o.facebook && o.facebook.post)
  : net === 'x' ? S(o.x && o.x.post) : '';
const withPosts = () => P.filter(p => POSTS[p.id]);
function bufferCSV(net){
  /* Buffer bulk upload: Text | Image URL | Tags | Posting Time (YYYY-MM-DD HH:mm), one file per channel. Free plan takes 10 rows per upload. */
  const rows = withPosts().map((p, i) => [postText(POSTS[p.id], net) + (net === 'facebook' || net === 'x' ? '\n' + productLink(p) : ''), absImg(p, 0), '', schedAt(i, '-')]);
  return csv([['Text', 'Image URL', 'Tags', 'Posting Time'], ...rows]);
}
function pinterestCSV(){
  /* Pinterest "Bulk create Pins": up to 200 rows per file; media must be public URLs. */
  const rows = withPosts().map((p, i) => { const o = POSTS[p.id];
    const kw = S(o.instagram && o.instagram.hashtags).split(/\s+/).map(h => h.replace(/^#/, '')).filter(Boolean).slice(0, 10).join(', ');
    return [S(o.pinterest && o.pinterest.title) || p.n, absImg(p, 0), p.cat, '', S(o.pinterest && o.pinterest.description) || p.d, productLink(p), schedAt(i, '-'), kw]; });
  return csv([['Title', 'Media URL', 'Pinterest board', 'Thumbnail', 'Description', 'Link', 'Publish date', 'Keywords'], ...rows]);
}
function publerCSV(){
  /* Publer CSV import: the 12 official template columns; one row per post. Free plan takes 5 rows per upload, paid 500. */
  const head = ['Date - Intl. format or prompt', 'Text', 'Link(s) - Separated by comma for FB carousels', 'Media URL(s) - Separated by comma', 'Title - For the video, pin, PDF ..', 'Label(s) - Separated by comma', 'Alt text(s) - Separated by ||', 'Comment(s) - Separated by ||', 'Pin board, FB album, or Google category', 'Post subtype - I.e. story, reel, PDF ..', 'CTA - For Facebook links or Google', 'Reminder - For stories, reels, shorts, and TikToks'];
  const rows = [];
  withPosts().forEach((p, i) => { const o = POSTS[p.id];
    for (const net of ['tiktok', 'instagram', 'facebook', 'x']) { const t = postText(o, net); if (t) rows.push([schedAt(i, '/'), t, net === 'facebook' || net === 'x' ? productLink(p) : '', absImg(p, 0), '', net, p.n, '', '', '', '', '']); }
    if (o.pinterest) rows.push([schedAt(i, '/'), S(o.pinterest.description), productLink(p), absImg(p, 0), S(o.pinterest.title), 'pinterest', p.n, '', p.cat, '', '', '']);
  });
  return csv([head, ...rows]);
}
function postsMD(){
  return withPosts().map(p => { const o = POSTS[p.id]; return `## ${p.n} (${eur(p.price)})\nLink: ${productLink(p)}\nPhoto: ${absImg(p, 0)}\n\n### TikTok / Reels\nHook: ${S(o.tiktok && o.tiktok.hook)}\n\n${S(o.tiktok && o.tiktok.script)}\n\nCaption: ${S(o.tiktok && o.tiktok.caption)}\n${S(o.tiktok && o.tiktok.hashtags)}\n\n### Instagram\n${S(o.instagram && o.instagram.caption)}\n${S(o.instagram && o.instagram.hashtags)}\n\n### Facebook\n${S(o.facebook && o.facebook.post)}\n\n### Pinterest\n${S(o.pinterest && o.pinterest.title)}\n${S(o.pinterest && o.pinterest.description)}\n\n### X\n${S(o.x && o.x.post)}\n`; }).join('\n');
}
const EXPORTS = {
  feed: ['nestia-feed.csv', feedCSV, false],
  pinterest: ['nestia-pinterest-pins.csv', pinterestCSV, true],
  'buffer-tiktok': ['nestia-buffer-tiktok.csv', () => bufferCSV('tiktok'), true],
  'buffer-instagram': ['nestia-buffer-instagram.csv', () => bufferCSV('instagram'), true],
  'buffer-facebook': ['nestia-buffer-facebook.csv', () => bufferCSV('facebook'), true],
  'buffer-x': ['nestia-buffer-x.csv', () => bufferCSV('x'), true],
  publer: ['nestia-publer.csv', publerCSV, true],
  md: ['nestia-posts.md', postsMD, true],
  imgs: ['nestia-photos.txt', () => P.map(p => [0,1,2,3].map(i => absImg(p, i)).join('\n')).join('\n'), false]
};
function renderExports(){
  const e = $('#exports'); if (!e) return;
  const n = Object.keys(POSTS).length;
  const dl = CAP.downloads;
  const btn = (id, label) => `<button class="sbtn" data-dl="${id}">${(dl ? '' : 'Show: ') + label}</button>`;
  const card = (title, text, buttons, linksHtml) => `<div class="exp"><b>${title}</b><p>${text}</p><div class="links">${buttons}${linksHtml || ''}</div></div>`;
  e.innerHTML = `
    ${card('Product feed (all products)', 'One CSV in the Google Shopping column layout. Upload it as a data source in Google Merchant Center (free listings), Meta Commerce Manager (Facebook + Instagram shop, checkout on your site) and Pinterest Catalogs. Each lists every product for free. Google and Meta need the shop on a domain you can verify; set <code>STORE.siteUrl</code> and <code>STORE.imageBase</code> to that domain when you move.', btn('feed', 'nestia-feed.csv'),
      `<a class="sbtn" href="https://merchants.google.com/" target="_blank" rel="noopener">Google Merchant</a><a class="sbtn" href="https://business.facebook.com/commerce/" target="_blank" rel="noopener">Meta Commerce</a><a class="sbtn" href="https://www.pinterest.com/business/hub/" target="_blank" rel="noopener">Pinterest</a>`)}
    ${card(`Pinterest: bulk create Pins (${n} of ${P.length})`, 'One CSV, one Pin per product with photo, title, description, keywords and the link back, scheduled one per day from tomorrow. Pinterest imports up to 200 Pins per file for free: Create → Bulk create Pins → upload. Check the column names against the sample template Pinterest offers there before uploading.', btn('pinterest', 'nestia-pinterest-pins.csv'),
      `<a class="sbtn" href="https://www.pinterest.com/pin-creation-tool/" target="_blank" rel="noopener">Pinterest bulk create</a>`)}
    ${card(`Buffer: one file per channel (${n} of ${P.length})`, 'Buffer’s bulk upload takes a CSV with the columns Text, Image URL, Tags, Posting Time, one file per connected channel. The free plan holds 3 channels and takes 10 rows per upload, so upload the first 10, then the rest once they are posted.', btn('buffer-tiktok', 'TikTok') + btn('buffer-instagram', 'Instagram') + btn('buffer-facebook', 'Facebook') + btn('buffer-x', 'X'),
      `<a class="sbtn" href="https://publish.buffer.com/" target="_blank" rel="noopener">Buffer</a>`)}
    ${card(`Publer: all posts in one file (${n} of ${P.length})`, 'Publer’s 12-column CSV template, one row per post and network, scheduled one product per day. Free plan: 3 accounts (no X), 5 rows per upload. Metricool’s free plan imports CSV too, but only in its own 18-column template: download it in Metricool and paste these columns in.', btn('publer', 'nestia-publer.csv'),
      `<a class="sbtn" href="https://app.publer.com/" target="_blank" rel="noopener">Publer</a><a class="sbtn" href="https://app.metricool.com/" target="_blank" rel="noopener">Metricool</a>`)}
    ${card('Native schedulers (no tool at all)', 'Meta Business Suite plans Facebook and Instagram posts and Reels for free; TikTok Studio schedules up to 10 days ahead; YouTube Studio schedules Shorts. Copy each post from the cards below and paste it in.', '',
      `<a class="sbtn" href="https://business.facebook.com/latest/planner" target="_blank" rel="noopener">Meta planner</a><a class="sbtn" href="https://www.tiktok.com/tiktokstudio/upload" target="_blank" rel="noopener">TikTok Studio</a><a class="sbtn" href="https://studio.youtube.com/" target="_blank" rel="noopener">YouTube Studio</a>`)}
    ${card('All posts as one text file', 'Every script and caption in reading order, for pasting by hand or into CapCut and Canva when you make the videos.', btn('md', 'nestia-posts.md'))}
    ${card('Photos for the posts', 'The four photos per product are in the <code>img/</code> folder next to this page (700×700 WebP). For TikTok and Reels, drop them into CapCut or Canva with the script as the voice-over.', btn('imgs', 'photo links'))}
    <div id="expOut"></div>`;
  $$('#exports [data-dl]').forEach(b => b.onclick = async () => {
    const k = b.dataset.dl;
    const [fname, build, needsPosts] = EXPORTS[k];
    if (needsPosts && !n){ show('Write the posts first.'); return; }
    const data = build();
    if (dl){
      try { await dl.save({filename: fname, data}); show(`${fname} saved.`); return; }
      catch (err) { if (err && err.code === 'declined') { show('Download cancelled.'); return; } }
    }
    show(`Copy the contents of <b>${fname}</b> from here:`, data);
  });
  function show(msg, data){
    const o = $('#expOut');
    o.innerHTML = `<div class="note" style="margin-top:8px">${msg}${data ? `<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="sbtn" id="expCopy">Copy all</button></div><textarea id="expTa" readonly style="width:100%;margin-top:8px;height:180px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)"></textarea>` : ''}</div>`;
    if (data){ $('#expTa').value = data; $('#expCopy').onclick = e => copyText(data, e.currentTarget); }
  }
}

/* ---- capabilities: light up owner tools and the smarter chat when the viewer can run them ---- */
async function boot(){
  const local = location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname);
  if (!window.claude || typeof window.claude.use !== 'function'){ if (local) enableOwner(); return; }
  const [u, s, d] = await Promise.all([claude.use('user'), claude.use('sample'), claude.use('downloads')]);
  CAP.user = u; CAP.sample = s; CAP.downloads = d;
  if (s){ chatAI = s; $('#chatStatus').innerHTML = '<i></i>Answers most questions'; }
  let owner = false;
  try { owner = u ? await u.isOwner() : false; } catch (e) { owner = false; }
  if (owner || local) enableOwner();
}

/* ---- start ---- */
renderStatic(); paintChips(); paintHero(); loadCart(); paint(); renderCart();
const h = location.hash.replace('#', '');
if (h && byId(h)) openPDP(h);
boot();
</script>
